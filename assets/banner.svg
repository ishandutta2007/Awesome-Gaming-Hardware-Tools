<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d17"/><stop offset="40%" stop-color="#0f172a"/><stop offset="100%" stop-color="#05070e"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff"/><stop offset="60%" stop-color="#f1f5f9"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient><linearGradient id="cyanGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".8"/></linearGradient><radialGradient id="ambientOrb" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".25"/><stop offset="70%" stop-color="#a855f7" stop-opacity=".08"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient><radialGradient id="cyberOrbRight" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".2"/><stop offset="80%" stop-color="#3b82f6" stop-opacity=".04"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient><pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".7" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity=".3"/></pattern><filter id="shadowFilter" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".7" stdDeviation="12"/></filter><filter id="glowFilter" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.7}50%{transform:scale(1.15) translate(-15px,10px);opacity:.95}}@keyframes floatBeam{0%{transform:translateX(-1200px)}}@keyframes pulseBorder{0%{stroke-opacity:.4}50%{stroke-opacity:.9}}@keyframes tagFloat{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}.ambient-orb-1{transform-origin:300px 180px;animation:pulseOrb 8s ease-in-out infinite}.ambient-orb-2{transform-origin:900px 160px;animation:pulseOrb 10s ease-in-out infinite reverse}.beam-line{animation:floatBeam 4s linear infinite}.border-pulse{animation:pulseBorder 3s ease-in-out infinite}.floating-tag{animation:tagFloat 4s ease-in-out infinite}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.title-text{font-weight:800;font-size:46px;letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:19px;letter-spacing:.2px}.badge-text{font-weight:600;font-size:12px;letter-spacing:1.2px;text-transform:uppercase}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><circle cx="320" cy="180" r="260" fill="url(#ambientOrb)" class="ambient-orb-1"/><circle cx="880" cy="180" r="240" fill="url(#cyberOrbRight)" class="ambient-orb-2"/><rect width="1200" height="360" fill="url(#cyberGrid)" rx="16"/><rect width="1196" height="356" x="2" y="2" fill="none" stroke="url(#primaryGrad)" stroke-width="2" class="border-pulse" rx="15"/><g clip-path="url(#borderClip)"><line x1="0" x2="360" y1="358" y2="358" stroke="url(#cyanGlow)" stroke-width="3" class="beam-line" filter="url(#glowFilter)"/></g><g opacity=".25" transform="translate(60, 110)"><rect width="120" height="80" x="0" y="0" fill="none" stroke="#6366f1" stroke-width="2" rx="20"/><circle cx="35" cy="40" r="14" fill="none" stroke="#38bdf8" stroke-width="2"/><path stroke="#38bdf8" stroke-linecap="round" stroke-width="2" d="M 35 32 L 35 48 M 27 40 L 