<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="ambientOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyberOrbRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#3b82f6" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.7; }
        50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.95; }
      }
      @keyframes floatBeam {
        0% { transform: translateX(-1200px); }
        100% { transform: translateX(1200px); }
      }
      @keyframes pulseBorder {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.9; }
      }
      @keyframes tagFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .ambient-orb-1 {
        transform-origin: 300px 180px;
        animation: pulseOrb 8s ease-in-out infinite;
      }
      .ambient-orb-2 {
        transform-origin: 900px 160px;
        animation: pulseOrb 10s ease-in-out infinite reverse;
      }
      .beam-line {
        animation: floatBeam 4s linear infinite;
      }
      .border-pulse {
        animation: pulseBorder 3s ease-in-out infinite;
      }
      .floating-tag {
        animation: tagFloat 4s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Lighting in Background (Non-intrusive) -->
  <circle class="ambient-orb-1" cx="320" cy="180" r="260" fill="url(#ambientOrb)" />
  <circle class="ambient-orb-2" cx="880" cy="180" r="240" fill="url(#cyberOrbRight)" />

  <!-- Cyber Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#cyberGrid)" />

  <!-- Outer Neon Border -->
  <rect class="border-pulse" x="2" y="2" width="1196" height="356" rx="15" fill="none" stroke="url(#primaryGrad)" stroke-width="2" />

  <!-- Moving Cyber Beam Accent along bottom border -->
  <g clip-path="url(#borderClip)">
    <line class="beam-line" x1="0" y1="358" x2="360" y2="358" stroke="url(#cyanGlow)" stroke-width="3" filter="url(#glowFilter)" />
  </g>

  <!-- Gaming Hardware Decorative Vector Accents (Left & Right Flanks) -->
  <!-- Left Side: Game Controller Nodes -->
  <g opacity="0.25" transform="translate(60, 110)">
    <rect x="0" y="0" width="120" height="80" rx="20" fill="none" stroke="#6366f1" stroke-width="2" />
    <circle cx="35" cy="40" r="14" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path d="M 35 32 L 35 48 M 27 40 L 43 40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="85" cy="32" r="5" fill="#a855f7" />
    <circle cx="95" cy="44" r="5" fill="#38bdf8" />
    <circle cx="75" cy="44" r="5" fill="#ec4899" />
    <circle cx="85" cy="56" r="5" fill="#10b981" />
  </g>

  <!-- Right Side: Server Stack / Cloud Hardware -->
  <g opacity="0.25" transform="translate(1020, 105)">
    <rect x="0" y="0" width="110" height="26" rx="6" fill="none" stroke="#06b6d4" stroke-width="2" />
    <circle cx="20" cy="13" r="3" fill="#10b981" />
    <line x1="34" y1="13" x2="90" y2="13" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" />
    
    <rect x="0" y="36" width="110" height="26" rx="6" fill="none" stroke="#6366f1" stroke-width="2" />
    <circle cx="20" cy="49" r="3" fill="#38bdf8" />
    <line x1="34" y1="49" x2="90" y2="49" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 3" />

    <rect x="0" y="72" width="110" height="26" rx="6" fill="none" stroke="#a855f7" stroke-width="2" />
    <circle cx="20" cy="85" r="3" fill="#ec4899" />
    <line x1="34" y1="85" x2="90" y2="85" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 3" />
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed high visibility and high contrast) -->
  <g id="foreground-content" transform="translate(0, 0)">
    <!-- Category Pill Tag (Subtle Floating Animation) -->
    <g class="floating-tag" transform="translate(600, 68)">
      <rect x="-175" y="-16" width="350" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
      <circle cx="-148" cy="0" r="4" fill="#10b981" filter="url(#glowFilter)" />
      <text class="badge-text" x="5" y="4" text-anchor="middle" fill="#c7d2fe">GAME BACKEND &amp; HARDWARE INFRASTRUCTURE</text>
    </g>

    <!-- Main Title -->
    <text class="title-text" x="600" y="155" text-anchor="middle" fill="url(#titleGrad)" filter="url(#shadowFilter)">
      Awesome Gaming &amp; Hardware Tools
    </text>

    <!-- Accent Underline Bar -->
    <rect x="420" y="178" width="360" height="4" rx="2" fill="url(#primaryGrad)" filter="url(#glowFilter)" />

    <!-- Subtitle Line 1 -->
    <text class="subtitle-text" x="600" y="222" text-anchor="middle" fill="#94a3b8">
      Curated Catalog of SaaS Backends, Platform SDKs &amp; Self-Hosted Gaming Infrastructure
    </text>

    <!-- Feature Highlights Tag Row -->
    <g transform="translate(600, 274)">
      <!-- Pill 1 -->
      <g transform="translate(-250, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text class="badge-text" x="0" y="4" text-anchor="middle" fill="#38bdf8">🎮 Game BaaS</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text class="badge-text" x="0" y="4" text-anchor="middle" fill="#a855f7">⚡ Platform SDKs</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(90, 0)">
        <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text class="badge-text" x="0" y="4" text-anchor="middle" fill="#34d399">🕹️ Hardware Tools</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(265, 0)">
        <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text class="badge-text" x="0" y="4" text-anchor="middle" fill="#f43f5e">🌐 Open Source</text>
      </g>
    </g>
  </g>
</svg>
